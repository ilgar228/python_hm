[project]
name = "python-hm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ilgar228", email = "ilgarallah@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [] 